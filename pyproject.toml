[tool.poetry]
name = "cortex"
version = "0.1.0"
description = "Slack AI Knowledge Assistant"
authors = ["Cortex Team"]
readme = "README.md"
packages = [{ include = "cortex" }]

[tool.poetry.dependencies]
python = "^3.12.4"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = "^2.0.0"
psycopg = { extras = ["binary"], version = "^3.2.0" }
pgvector = "^0.3.0"
pydantic = "^2.13.4"
pydantic-settings = "^2.0.0"
httpx = "^0.28.1"
python-dotenv = "^1.2.2"
structlog = "^25.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
pytest-cov = "^7.0.0"
factory-boy = "^3.3.3"
ruff = "^0.12.4"
mypy = "^1.17.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cortex --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["cortex"]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
